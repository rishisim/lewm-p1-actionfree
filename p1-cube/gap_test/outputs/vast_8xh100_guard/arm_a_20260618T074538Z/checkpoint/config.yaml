output_model_name: lewm_cube_play_arm_a_conditioned_8xh100_ddp_bs768
subdir: lewm_cube_play_arm_a_conditioned_8xh100_ddp_bs768
num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3
action_free: false
ckpt_path: null
trainer:
  max_epochs: 100
  devices: 8
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  strategy: ddp
loader:
  batch_size: 768
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true
optimizer:
  type: AdamW
  lr: 5.0e-05
  weight_decay: 0.001
num_preds: 1
loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
wandb:
  enabled: false
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: false
data:
  dataset:
    name: /workspace/lewm-p1-inversedynamics/p1-cube/data/lewm_hdf5/visual_cube_single_play_pretrain_pool.h5
    num_steps: ${eval:'${num_preds} + ${history_size}'}
    frameskip: 5
    keys_to_load:
    - pixels
    - action
    - observation
    keys_to_cache:
    - action
    - observation
    keys_to_merge:
      proprio: proprio
model:
  _target_: jepa.JEPA
  encoder_gradient_checkpointing: false
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: tiny
    patch_size: 14
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
    _attn_implementation: sdpa
  predictor:
    _target_: module.ARPredictor
    num_frames: ${history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: module.Embedder
    input_dim: 25
    emb_dim: ${embed_dim}
  projector:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
